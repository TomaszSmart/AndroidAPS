name: Build signed AAPS (fork)

# Builds the full release APK from this branch, runs the trend arrow unit tests and signs the APK
# with your own keystore. Run manually (Actions -> Build signed AAPS (fork) -> Run workflow) or push to the branch below.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# NOTE: an AAPS already installed from a different signer cannot be updated by this APK - Android refuses it.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (both are signed with the same key)'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - aapsclientRelease
      sourceTag:
        description: 'Optional official upstream tag to build instead of this branch (e.g. 3.4.2.6 for AAPSClient). Leave empty for this branch.'
        required: false
        default: ''
        type: string
  push:
    branches: [ native-trend-arrow ]

env:
  JAVA_VERSION: 21
  # push builds have no inputs, they build the full app
  VARIANT: ${{ inputs.variant || 'fullRelease' }}
  SOURCE_TAG: ${{ inputs.sourceTag || '' }}

jobs:
  trend-arrow-tests:
    if: ${{ inputs.sourceTag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: TrendCalculatorImpl unit tests
        run: ./gradlew :implementation:testAndroidHostTest --tests "*TrendCalculatorImplTest" --stacktrace

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Switch to upstream tag
        if: ${{ env.SOURCE_TAG != '' }}
        run: |
          git fetch --depth=1 https://github.com/nightscout/AndroidAPS.git "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          git checkout "refs/tags/$SOURCE_TAG"
          git log --oneline -1

      - name: Build ${{ env.VARIANT }} (unsigned)
        run: |
          ARGS=""
          if [ -n "$SOURCE_TAG" ]; then
            ARGS="-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.compiler.execution.strategy=in-process"
          fi
          ./gradlew ":app:assemble${VARIANT^}" $ARGS --stacktrace

      - name: Locate unsigned APK
        run: |
          FLAVOR=$(echo "$VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          IN=$(find "app/build/outputs/apk/$FLAVOR" -name '*.apk' | head -1)
          echo "Found APKs:"; find app/build/outputs -name '*.apk' -exec ls -l {} \;
          if [ -z "$IN" ]; then echo "::error::No APK found for variant $VARIANT"; exit 1; fi
          echo "UNSIGNED_APK=$IN" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-${{ env.VARIANT }}
          path: ${{ env.UNSIGNED_APK }}
          retention-days: 1

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] || fail "Secret KEYSTORE_BASE64 is missing"
          [ -n "$KEYSTORE_PASSWORD" ] || fail "Secret KEYSTORE_PASSWORD is missing"
          [ -n "$KEY_ALIAS" ] || fail "Secret KEY_ALIAS is missing"
          [ -n "$KEY_PASSWORD" ] || fail "Secret KEY_PASSWORD is missing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" || fail "KEYSTORE_BASE64 is not valid base64"
          echo "keystore size: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"; ls "$SDK/build-tools" || fail "no build-tools under $SDK"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
          echo "BT=$BT"
          LABEL="${SOURCE_TAG:-native-trend-arrow}"
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          OUT="AAPS-${VARIANT}-${LABEL}-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED_APK" aligned.apk || fail "zipalign failed"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks"             --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD             --out "$OUT" aligned.apk || fail "apksigner sign failed (wrong password or alias?)"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-256|Verifies"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      # The signed APK is uploaded to the owner's Google Drive (secret GDRIVE_OAUTH2, same as aaps-ci).
      # It is deliberately NOT published on the public Releases page or as a workflow artifact.
      - name: Upload signed APK to Google Drive
        env:
          GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$GDRIVE_OAUTH2" ] || fail "Secret GDRIVE_OAUTH2 is missing"
          DECODED=$(printf '%s' "$GDRIVE_OAUTH2" | base64 -d) || fail "GDRIVE_OAUTH2 is not valid base64"
          CLIENT_ID=$(printf '%s' "$DECODED" | cut -d'|' -f1)
          REFRESH_TOKEN=$(printf '%s' "$DECODED" | cut -d'|' -f2)
          echo "::add-mask::$CLIENT_ID"; echo "::add-mask::$REFRESH_TOKEN"
          TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token             -d client_id="$CLIENT_ID" -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token)
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r .access_token)
          [ -n "$ACCESS_TOKEN" ] && [ "$ACCESS_TOKEN" != "null" ] || fail "Could not get a Google access token (is GDRIVE_OAUTH2 still valid?)"
          echo "::add-mask::$ACCESS_TOKEN"

          find_or_create_folder() {
            NAME=$1; PARENT=$2
            Q="name='${NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false"
            [ -n "$PARENT" ] && Q="$Q and '${PARENT}' in parents"
            ID=$(curl -s -G -H "Authorization: Bearer $ACCESS_TOKEN"               --data-urlencode "q=$Q" "https://www.googleapis.com/drive/v3/files" | jq -r '.files[0].id')
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              if [ -n "$PARENT" ]; then BODY="{\"name\":\"$NAME\",\"mimeType\":\"application/vnd.google-apps.folder\",\"parents\":[\"$PARENT\"]}"
              else BODY="{\"name\":\"$NAME\",\"mimeType\":\"application/vnd.google-apps.folder\"}"; fi
              ID=$(curl -s -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json"                 -d "$BODY" "https://www.googleapis.com/drive/v3/files" | jq -r '.id')
            fi
            echo "$ID"
          }

          AAPS_FOLDER_ID=$(find_or_create_folder "AAPS" "")
          [ -n "$AAPS_FOLDER_ID" ] && [ "$AAPS_FOLDER_ID" != "null" ] || fail "Could not find or create the AAPS folder on Drive"
          FOLDER_ID=$(find_or_create_folder "fork-builds" "$AAPS_FOLDER_ID")
          [ -n "$FOLDER_ID" ] && [ "$FOLDER_ID" != "null" ] || fail "Could not create the fork-builds folder on Drive"

          HTTP_CODE=$(curl -s -o /tmp/gdrive_response.json -w "%{http_code}" -X POST             -H "Authorization: Bearer $ACCESS_TOKEN"             -F "metadata={\"name\":\"$APK_NAME\", \"parents\":[\"$FOLDER_ID\"]};type=application/json;charset=UTF-8"             -F "file=@$APK_NAME;type=application/vnd.android.package-archive"             "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            fail "Drive upload failed, HTTP $HTTP_CODE"
          fi
          echo "Uploaded $APK_NAME to Google Drive: AAPS/fork-builds"
