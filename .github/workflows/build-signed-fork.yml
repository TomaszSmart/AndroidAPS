name: Build signed AAPS (fork)

# Builds the full release APK from this branch, runs the trend arrow unit tests and signs the APK
# with your own keystore. Run manually (Actions -> Build signed AAPS (fork) -> Run workflow) or push to the branch below.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# NOTE: an AAPS already installed from a different signer cannot be updated by this APK - Android refuses it.

on:
  workflow_dispatch:
  push:
    branches: [ native-trend-arrow ]

env:
  JAVA_VERSION: 21

jobs:
  trend-arrow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: TrendCalculatorImpl unit tests
        run: ./gradlew :implementation:testAndroidHostTest --tests "*TrendCalculatorImplTest" --stacktrace

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # needed to publish the APK as a GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Build full release (unsigned)
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing - see the header of this workflow file"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=$(find app/build/outputs/apk/full/release -name '*.apk' | head -1)
          echo "Input APK: $IN"
          OUT="AAPS-native-trend-arrow-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=aaps-build-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "AAPS 4.0.0-rc1 + source trend arrow (${GITHUB_SHA::7})" \
            --notes "Signed fork build from ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}. Not an official AAPS build." \
            --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30
